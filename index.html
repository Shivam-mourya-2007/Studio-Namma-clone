<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./nav.css">
  <style>
    .content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 99vw;
      align-items: center;
      justify-content: center;
    }

    .content>h1 {
      font-size: 70px;

    }

    .animate {
      transform: rotateX(90deg);
      transition-duration: 3s;
      transform-origin: bottom;
      font-size: 60px;
      text-align: center;
    }

    .animate.show {
      transform: rotateX(0deg);
    }

    iframe {
      height: 100%;
      width: 100%;
    }

    .slideImage {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      overflow: hidden;
    }

    @media (max-width: 500px) {
      .slideImage {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 20px;
        overflow: hidden;
      }
    }

    .slideImage>div>img {
      height: 500px;
      width: 100%;
    }

    .slideImage>div {
      margin: 20px;

    }

    .slideImage>div>.left {
      transform: translateX(-100%) translateY(50%) rotate(-30deg);
      transition-duration: 3s;
    }

    .slideImage>div>.right {
      transform: translateX(100%) translateY(20%) rotate(30deg);
      transition-duration: 3s;
    }

    .content > .text{
      transition-duration: 0s;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <section class="content">
    <h1 class="animate">WE THINK</h1>
    <h1 class="animate">CRAFT AND</h1>
    <h1 class="animate">DESIGN</h1>
  </section>

  <section class="content">
    <iframe
      src="https://player.vimeo.com/video/1127104834?background=1&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1"
      frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin" title="Showreel_Namma_EN" data-ready="true">
    </iframe>
  </section>

  <section class="content">
    <p>Creative studio building premium Brands</p>
    <h2 class="animate">
      It’s never “just a website.”
      Every detail matters.
      We craft digital experiences.
      Your design. Our obsession.
      Your brand. Our playground.
    </h2>
  </section>

  <section class="content">
    <h2 class="animate">PLAYGROUND</h2>
  </section>

  <section class="slideImage">
    <div>
      <img class="left"
        src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68bb0be00336912e360b324f_main%20case%20cover%20matera%20(1).webp"
        alt="">
    </div>
    <div>
      <img class="right"
        src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68bb0be00336912e360b324f_main%20case%20cover%20matera%20(1).webp"
        alt="">
    </div>
    <div>
      <img class="left"
        src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68bb0be00336912e360b324f_main%20case%20cover%20matera%20(1).webp"
        alt="">
    </div>
    <div>
      <img class="right"
        src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68bb0be00336912e360b324f_main%20case%20cover%20matera%20(1).webp"
        alt="">
    </div>
  </section>


  <div class="content art">
    <h1 class="animate text">ART DIRECTION</h1>
    <h1 class="animate text">BRANDING</h1>
    <h1 class="animate text">WEB FLOW</h1>
  </div>
</body>
<script src="navbar.js"></script>
<script>
  let texts = document.querySelectorAll(".content > .animate");
  let images = document.querySelectorAll(".slideImage > div > img")



  let observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.classList.add("show")
      }
      else {
        entry.target.classList.remove("show")
      }
    })
  })

  texts.forEach((text) => {
    observer.observe(text);
  })


  let observer2 = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.style.transform = "translateX(0%)"
      }
    })
  })

  images.forEach((img) => {
    observer2.observe(img)
  })



  let service = document.querySelectorAll(".art > .animate");

  service.forEach((element)=>{
    console.log(element)
    element.addEventListener("mouseenter", (event)=>{
      console.log(event.target.innerText)

      service.forEach((text)=>{
        if(text.innerText != event.target.innerText){
          text.style.color = "gray"
        }
        else{
          text.style.color = "black"
        }
      })

    })
  })
</script>

</html>
