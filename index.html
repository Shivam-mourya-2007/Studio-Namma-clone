<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=League+Gothic&family=Bebas+Neue&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./nav.css">
  <style>
    * {
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }

    body {
      background-color: #e8e8e4;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      border: 3px solid black;
      font-size: 250%;
    }

    .animate {
      transform: rotateX(90deg);
      transition-duration: 1s;
      transform-origin: bottom;
      text-align: center;
    }

    .animate.show {
      transform: rotateX(0deg);
    }

    .content>iframe {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .slideImage {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      overflow: hidden;
    }

    .slideImage>div>img {
      width: 100%;
    }

    .left {
      transform: translateX(-50%) translateY(40%) rotateZ(-20deg);
      transition-duration: 0.5s;
    }

    .right {
      transform: translateX(50%) translateY(40%) rotateZ(20deg);
      transition-duration: 0.5s;
    }

    .slideImage>.show>img {
      transform: translateX(0);
    }


    #cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 20px;
      height: 20px;
      background: #4f46e5;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(150%, 150%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
      transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1),
        height 0.3s cubic-bezier(0.25, 1, 0.5, 1),
        border-radius 0.3s cubic-bezier(0.25, 1, 0.5, 1),
        transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #cursor span {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    #cursor.label {
      width: 120px;
      height: 34px;
      border-radius: 6px;
      transform: translate(-50%, -50%);
    }

    #cursor.label span {
      opacity: 1;
    }

    #videoCursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 320px;
      height: 480px;
      border: 2px solid black;
      border-radius: 20px;
      z-index: 10000;
      display: none;
      pointer-events: none;
      overflow: hidden;
    }

    #videoCursor iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 853px;
      height: 480px;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      padding-top: 60px;
    }

    .hero-text {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    .hero-text h1 {
      font-family: 'Anton', 'League Gothic', 'Bebas Neue', sans-serif;
      font-size: 12vw;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 0px;
      color: #111111;
      text-align: center;
      transform: rotateX(90deg);
      transition: transform 2s ease;
      transform-origin: bottom;
    }

    .hero-text h1.show {
      transform: rotateX(0deg);
    }

    /* Manifesto Section Styling */
    .manifesto-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 3rem 1.5rem;
      box-sizing: border-box;
    }

    .manifesto-sub {
      font-family: 'Oswald', 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #111111;
      margin-bottom: 3rem;
    }

    .manifesto-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1300px;
    }

    .manifesto-text h2 {
      font-family: 'Anton', 'League Gothic', 'Oswald', sans-serif;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #111111;
      text-align: center;
      margin: 0;
      white-space: nowrap;
      transform: rotateX(90deg);
      transition: transform 1s ease;
      transform-origin: bottom;
    }

    .manifesto-text h2.line-1 {
      font-size: 4.8vw;
    }

    .manifesto-text h2.line-2 {
      font-size: 6.2vw;
    }

    .manifesto-text h2.line-3 {
      font-size: 4.7vw;
    }

    .manifesto-text h2.line-4 {
      font-size: 4.9vw;
    }

    .manifesto-text h2.line-5 {
      font-size: 4.9vw;
    }

    .manifesto-text h2.show {
      transform: rotateX(0deg);
    }

    .manifesto-text u.underline-target {
      text-decoration: underline;
      text-underline-offset: 8px;
      text-decoration-thickness: 4px;
    }

    @media (max-width: 768px) {
      .manifesto-text h2.line-1 {
        font-size: 7.2vw;
      }

      .manifesto-text h2.line-2 {
        font-size: 9.2vw;
      }

      .manifesto-text h2.line-3 {
        font-size: 7.0vw;
      }

      .manifesto-text h2.line-4 {
        font-size: 7.3vw;
      }

      .manifesto-text h2.line-5 {
        font-size: 7.3vw;
      }
    }
  </style>
</head>

<body>

  <section class="content">

  <section class="slideImage">
    <div data-cursor-label="PORTFOLIO">
      <img class="left"
        src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68bb0be00336912e360b324f_main%20case%20cover%20matera%20(1)-p-2000.webp"

    <div data-cursor-label="PORTFOLIO">
      <img class="right"

    <div data-cursor-label="PORTFOLIO">
      <img class="left"

      <img class="right"

  <!-- Fixed Bottom Bar -->

</body>

<script>
  let texts = document.querySelectorAll(".animate");



  let observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.classList.add("show")
      }
      else {
        entry.target.classList.remove("show")
      }
    })
  })

  texts.forEach((text) => {
    observer.observe(text);
  })


  let observer2 = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.classList.add("show")

      }
      // else{
      //   entry.target.classList.remove("show")
      // }
    })
  })

  let images = document.querySelectorAll(".slideImage > div");

  images.forEach((img) => {
    observer2.observe(img)
  })


  let list = document.querySelectorAll(".art > h1");

  list.forEach((element) => {
    element.addEventListener("mouseenter", (event) => {
      console.log(event.target)
      list.forEach((text) => {
        if (text.innerText == event.target.innerText) {
          text.style.color = "black"
        }
        else {
          text.style.color = "gray"
        }
      })
    })
  })




  //+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++//

  const hero = document.querySelector(".hero");
  const cursor = document.getElementById("cursor");
  const videoCursor = document.getElementById("videoCursor");

  let lastClientX = 0;
  let lastClientY = 0;

  function updateCursorState(clientY) {
    const heroRect = hero.getBoundingClientRect();
    if (clientY >= heroRect.top && clientY <= heroRect.bottom) {
      videoCursor.style.display = "block";
      cursor.style.display = "none";
    } else {
      videoCursor.style.display = "none";
      cursor.style.display = "block";
    }
  }

  document.addEventListener("mousemove", (e) => {
    lastClientX = e.clientX;
    lastClientY = e.clientY;

    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

    videoCursor.style.left = (e.clientX + 40) + "px";
    videoCursor.style.top = (e.clientY + 30) + "px";

    updateCursorState(e.clientY);
  });

  window.addEventListener("scroll", () => {
    updateCursorState(lastClientY);
  });

  document.addEventListener("mouseover", (e) => {
    const target = e.target.closest("[data-cursor-label]");
    if (target) {
      const label = target.getAttribute("data-cursor-label");
      const span = cursor.querySelector("span");
      if (span) {
        span.innerText = label;
      }
      cursor.classList.add("label");
    }
  });

  document.addEventListener("mouseout", (e) => {
    const target = e.target.closest("[data-cursor-label]");
    const nextTarget = e.relatedTarget ? e.relatedTarget.closest("[data-cursor-label]") : null;
    if (target && target !== nextTarget) {
      cursor.classList.remove("label");
      const span = cursor.querySelector("span");
      if (span) {
        span.innerText = "";
      }
    }
  });

</script>
